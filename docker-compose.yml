version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: importadora-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password # Coincide con tu database.service.ts
      POSTGRES_DB: importadora
    ports:
      - "5432:5432"
    volumes:
      - importadora-db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: importadora-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@importadora.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  importadora-db-data:
